[pytest]
# Basic configuration
addopts = -v -s --tb=short --strict-markers

# Test discovery paths
testpaths = features steps

# Python files to consider as test files
python_files = *.feature *_steps.py

# Classes to consider as test classes
python_classes = Test*

# Functions to consider as test functions
python_functions = test_*

# Markers for test categorization
markers =
    smoke: Smoke tests for critical functionality
    regression: Regression tests for full suite
    critical: Critical path tests
    admin: Admin module specific tests
    pim: PIM module specific tests
    leave: Leave module specific tests
    profile: Profile module specific tests
    negative: Negative test cases
    slow: Tests that take longer to execute

# Logging configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for tests (in seconds)
# timeout = 300

# JUnit XML report (for CI/CD integration)
# junit_family = xunit2